<!DOCTYPE html>
<html lang="en">

<head>
    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="JSON, Compare, Solve">
    <meta name="author" content="Samuel Gauthier">
    <meta name="description"
        content="Tool allowing you to compare two JSONs to find the added, removed and changed properties">

    <title>JSON Compare</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/input.css">
    <link rel="stylesheet" href="styles/buttons.css">

    <!-- JAVASCRIPT -->
    <script src="scripts/AdditionChecker.js"></script>
    <script src="scripts/RemovalChecker.js"></script>
    <script src="scripts/ChangesChecker.js"></script>
    <script src="scripts/script.js"></script>
</head>

<body>
    <div id="mainContainer">
        <div id="textContainer">
            <div id="inputContainer">
                <div class="input-group">
                    <textarea id="originalInput" placeholder="Paste the original JSON"></textarea>
                    <label for="">Original</label>
                </div>
                <div class="input-group">
                    <textarea id="modifiedInput" placeholder="Paste the modified JSON"></textarea>
                    <label for="">Modified</label>
                </div>
            </div>
            <div id="outputContainer">
                <div class="input-group">
                    <textarea id="removedOutput" readonly
                        placeholder="JSON found in the original that the modified doesn't have"></textarea>
                    <label for="" title="Content removed from the original JSON">Removed</label>
                </div>
                <div class="input-group">
                    <textarea id="changedOutput" readonly
                        placeholder="JSON found in the original that has been changed in modified JSON"></textarea>
                    <label for="" title="Content changed from the original JSON">Changed</label>
                </div>
                <div class="input-group">
                    <textarea id="addedOutput" readonly
                        placeholder="JSON found in the modified that the original doesn't have"></textarea>
                    <label for="" title="Content added by the modified JSON">Added</label>
                </div>
            </div>
        </div>
        <div id="buttonContainer">
            <div id="actionButtonContainer">
                <i class="fa-solid fa-broom" id="prettifyButton" title="Prettify both inputs"></i>
                <i class="fa-solid fa-trash-can" id="clearAllButton" title="Clear all inputs"></i>
                <i class="fa-solid fa-angles-up" id="copyUpButton" title="Copy the modified to the original"></i>
                <i class="fa-solid fa-angles-down" id="copyDownButton" title="Copy the original to the modified"></i>
            </div>
            <button id="compareButton" title="Compare both inputs">Compare</button>
            <div id="errorContainer">
                <span id="errorText"></span>
            </div>
        </div>
    </div>
</body>

</html>
